<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title desc">
  <title id="title">Sky’s Bridge memorial star</title>
  <desc id="desc">An elegant four-point gold star with a softly faceted centre.</desc>
  <defs>
    <linearGradient id="outerGold" x1="0.18" y1="0.08" x2="0.82" y2="0.94">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.34" stop-color="#f8d889"/>
      <stop offset="0.68" stop-color="#e4aa43"/>
      <stop offset="1" stop-color="#b86f17"/>
    </linearGradient>
    <radialGradient id="centreLight" cx="50%" cy="50%" r="58%">
      <stop offset="0" stop-color="#fffdf1"/>
      <stop offset="0.36" stop-color="#fff2b4"/>
      <stop offset="1" stop-color="#e6a83b" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="3.4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.94  0 0.78 0 0 0.50  0 0 0.22 0 0.10  0 0 0 0.48 0" result="goldBlur"/>
      <feMerge>
        <feMergeNode in="goldBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <!-- An eight-point celestial sparkle: four long rays and four fine rays. -->
    <path d="M100 4 L108.4 79.7 L133.9 66.1 L120.3 91.6 L196 100 L120.3 108.4 L133.9 133.9 L108.4 120.3 L100 196 L91.6 120.3 L66.1 133.9 L79.7 108.4 L4 100 L79.7 91.6 L66.1 66.1 L91.6 79.7 Z" fill="url(#outerGold)"/>
    <circle cx="100" cy="100" r="28" fill="url(#centreLight)"/>
    <path d="M100 73 L127 100 L100 127 L73 100 Z" fill="#fff0ae" fill-opacity="0.34"/>
    <circle cx="100" cy="100" r="4.4" fill="#fffdf2"/>
  </g>
</svg>
