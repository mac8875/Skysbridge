[build]
  publish = "."
  # Optional CC0 seasonal sound; the rest of the website never depends on audio availability.
  command = "python3 scripts/bundle-christmas-bells.py"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"


[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/js/app-de-v41.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
