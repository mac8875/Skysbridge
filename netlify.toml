[build]
  publish = "."
  # Bundle CC0 recording locally; no third-party requests from visitors.
  command = "mkdir -p assets && curl --fail --location --silent --show-error --retry 2 --max-time 30 https://audio.sfxjar.com/audio/0585.mp3 --output assets/christmas-sleigh-bells.mp3 && test -s assets/christmas-sleigh-bells.mp3"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"


[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/js/app-de-v41.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
