name: Mobile builds

on:
  push:
    branches:
      - codex/capacitor-mobile-2026-10-19
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: python -m pip install Pillow
      - run: python scripts/generate-app-icons.py
      - run: npm run sync:mobile
      - run: cd android && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: skysbridge-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios-simulator:
    name: iOS simulator build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python -m pip install Pillow
      - run: python scripts/generate-app-icons.py
      - run: npm run sync:mobile
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - run: cd build/ios/Build/Products/Debug-iphonesimulator && zip -r "$GITHUB_WORKSPACE/skysbridge-ios-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: skysbridge-ios-simulator
          path: skysbridge-ios-simulator.zip
          if-no-files-found: error
