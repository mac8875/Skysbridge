name: Skysbridge mobile builds

on:
  push:
    branches: [main, codex/skysbridge-capacitor-build]
    paths-ignore:
      - skysbridge-android.apk
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skysbridge-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android debug APK (${{ matrix.edition }})
    strategy:
      fail-fast: false
      matrix:
        edition: [christmas, classic]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "macOS" ]; then
              brew install ffmpeg
            else
              sudo apt-get update
              sudo apt-get install -y ffmpeg
            fi
          fi
      - run: npm ci
      - run: npm run build:mobile
      - name: Remove seasonal experience from Classic bundle
        if: matrix.edition == 'classic'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for page in Path('www').rglob('*.html'):
              html = page.read_text(encoding='utf-8')
              html = re.sub(r'<script\b[^>]*src=["\'][^"\']*christmas-special\.js[^"\']*["\'][^>]*>\s*</script>', '', html, flags=re.I)
              page.write_text(html, encoding='utf-8')
          Path('www/christmas.html').unlink(missing_ok=True)
          Path('www/js/christmas-special.js').unlink(missing_ok=True)
          Path('www/assets/christmas-sleigh-bells-rhythm.mp3').unlink(missing_ok=True)
          PY
      - run: npx cap add android
      - run: node scripts/patch-android-intro-fullscreen.mjs
      - run: npx @capacitor/assets generate --android
      - run: npx cap sync android
      - name: Verify localized typography and intro assets are bundled
        run: |
          test -s www/assets/skysbridge-app-intro.mp4
          test -s android/app/src/main/assets/public/assets/skysbridge-app-intro.mp4
          test -s android/app/src/main/assets/public/css/native-app-typography.css
          while IFS= read -r -d '' page; do
            bundled="android/app/src/main/assets/public/${page#www/}"
            test -s "$bundled"
            grep -q 'native-app-typography.css' "$bundled"
            grep -q "classList.add('skysbridge-native')" "$bundled"
          done < <(find www -type f -name '*.html' -print0)
      - name: Verify Android Christmas assets are bundled
        if: matrix.edition == 'christmas'
        run: |
          bundle=android/app/src/main/assets/public
          test -s "$bundle/christmas.html"
          test -s "$bundle/js/christmas-special.js"
          test -s "$bundle/assets/christmas-sleigh-bells-rhythm.mp3"
          grep -q 'platform !== "android"' "$bundle/js/christmas-special.js"
          node --check "$bundle/js/christmas-special.js"
          node --check "$bundle/js/sky-3d.js"
          for page in index.html index-de.html index-es.html christmas.html; do
            grep -q 'js/christmas-special.js' "$bundle/$page"
          done
      - name: Verify Classic and shared homepage content
        run: |
          bundle=android/app/src/main/assets/public
          for page in index.html index-de.html index-es.html; do
            test "$(grep -c 'class="trust-icon"' "$bundle/$page")" -eq 4
            grep -q 'homepage-trust-styles' "$bundle/$page"
            if [ "${{ matrix.edition }}" = classic ]; then
              ! grep -q 'christmas-special.js' "$bundle/$page" || exit 1
            fi
          done
          if [ "${{ matrix.edition }}" = classic ]; then
            test ! -e "$bundle/christmas.html"
            test ! -e "$bundle/js/christmas-special.js"
          fi
      - name: Isolate pull-request preview from the installed app
        if: github.event_name == 'pull_request'
        run: |
          sed -i 's/applicationId "org.skysbridge.app"/applicationId "org.skysbridge.app.lovepreview"/' android/app/build.gradle
          sed -i 's/<string name="app_name">Skysbridge<\/string>/<string name="app_name">Skysbridge Preview<\/string>/' android/app/src/main/res/values/strings.xml
      - run: sed -i 's/versionCode 1/versionCode 119/' android/app/build.gradle
      - run: sed -i 's/versionName ".*"/versionName "1.0.37"/' android/app/build.gradle
      - run: ./gradlew --no-daemon assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: skysbridge-android-${{ matrix.edition }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios-simulator:
    name: iOS Simulator app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "macOS" ]; then
              brew install ffmpeg
            else
              sudo apt-get update
              sudo apt-get install -y ffmpeg
            fi
          fi
      - run: npm ci
      - run: npm run build:mobile
      - run: npx cap add ios
      - run: npx @capacitor/assets generate --ios
      - run: npx cap sync ios
      - name: Build for iOS Simulator
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CURRENT_PROJECT_VERSION=83 MARKETING_VERSION=1.0.3
          CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/App.app" "$RUNNER_TEMP/skysbridge-ios-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: skysbridge-ios-simulator
          path: ${{ runner.temp }}/skysbridge-ios-simulator.zip
          if-no-files-found: error

  publish-android:
    name: Publish Android APK download
    needs: android
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: skysbridge-android-christmas
          path: christmas-apk
      - uses: actions/download-artifact@v4
        with:
          name: skysbridge-android-classic
          path: classic-apk
      - name: Prepare public APK filenames
        run: |
          cp christmas-apk/app-debug.apk skysbridge-android.apk
          cp christmas-apk/app-debug.apk skysbridge-android-christmas.apk
          cp classic-apk/app-debug.apk skysbridge-android-classic.apk
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: android-v119
          name: Skysbridge Android v1.0.37
          body: Skysbridge Android v1.0.37 (build 119), Christmas and Classic editions. Both use the same app ID; choose one to install. The standard download is the Christmas edition.
          files: |
            skysbridge-android.apk
            skysbridge-android-christmas.apk
            skysbridge-android-classic.apk
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
