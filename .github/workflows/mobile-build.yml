name: Skysbridge mobile builds

on:
  push:
    branches: [main, codex/skysbridge-capacitor-build]
    paths-ignore:
      - skysbridge-android.apk
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skysbridge-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build:mobile
      - run: npx cap add android
      - run: node scripts/patch-android-intro-fullscreen.mjs
      - run: npx @capacitor/assets generate --android
      - run: npx cap sync android
      - name: Isolate pull-request preview from the installed app
        if: github.event_name == 'pull_request'
        run: |
          sed -i 's/applicationId "org.skysbridge.app"/applicationId "org.skysbridge.app.lovepreview"/' android/app/build.gradle
          sed -i 's/<string name="app_name">Skysbridge<\/string>/<string name="app_name">Skysbridge Preview<\/string>/' android/app/src/main/res/values/strings.xml
      - run: sed -i 's/versionCode 1/versionCode 99/' android/app/build.gradle
      - run: sed -i 's/versionName ".*"/versionName "1.0.19"/' android/app/build.gradle
      - run: ./gradlew --no-daemon assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: skysbridge-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios-simulator:
    name: iOS Simulator app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:mobile
      - run: npx cap add ios
      - run: npx @capacitor/assets generate --ios
      - run: npx cap sync ios
      - name: Build for iOS Simulator
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CURRENT_PROJECT_VERSION=82 MARKETING_VERSION=1.0.2
          CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/App.app" "$RUNNER_TEMP/skysbridge-ios-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: skysbridge-ios-simulator
          path: ${{ runner.temp }}/skysbridge-ios-simulator.zip
          if-no-files-found: error

  publish-android:
    name: Publish Android APK download
    needs: android
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: skysbridge-android-debug
      - name: Prepare public APK filename
        run: mv app-debug.apk skysbridge-android.apk
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: android-v99
          name: Skysbridge Android v1.0.19
          body: Skysbridge Android app version 1.0.19, build 99. Install on Android to try it.
          files: skysbridge-android.apk
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
